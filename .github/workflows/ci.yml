name: Complete CI/CD Pipeline
on:
    push:
        branches: [main]

jobs:
    backend-test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:latest
                env:
                    POSTGRES_DB: shop-cart
                    POSTGRES_USER: namduongit
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - uses: actions/checkout@v4

            - name: Setup Java 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Backend Tests (JUnit 5 + Mockito)
              run: |
                  cd backend
                  mvn clean test jacoco:report
              env:
                  SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/shop-cart
                  SPRING_DATASOURCE_USERNAME: namduongit
                  SPRING_DATASOURCE_PASSWORD: password
                  SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
                  SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
                  JWT_SECRET: this-is-a-long-secret-token-jwt-reuquired-greate-than-32-char
                  MOMO_ENDPOINT: http://endpoint.com
                  MOMO_PARTNER_CODE: http://partner_code.com
                  MOMO_ACCESS_KEY: http://access_key.com
                  MOMO_SECRET_KEY: http://secret_key.com
                  MOMO_IPN: http://ipn.com
                  MOMO_RETURN: http://return.com

            - name: Upload Backend Coverage
              uses: codecov/codecov-action@v4
              with:
                  files: ./backend/target/site/jacoco/jacoco.xml

    frontend-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies
              run: cd frontend && npm ci

            - name: Run Unit Tests (Vitest)
              run: cd frontend && npm run test -- --coverage

            - name: Upload Frontend Coverage
              uses: codecov/codecov-action@v4
              with:
                  files: ./frontend/coverage/lcov.info

    e2e-test:
        runs-on: ubuntu-latest
        needs: [backend-test, frontend-test]
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node.js 22
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Install dependencies
              run: cd frontend && npm ci

            - name: Install Playwright
              run: cd frontend && npx playwright install --with-deps

            - name: Run E2E Tests (Playwright)
              run: cd frontend && npx playwright test

            - name: Upload Playwright Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: playwright-html-report
                  path: frontend/playwright-report/
                  retention-days: 30
